[build-system]
requires = ["setuptools>=65", "wheel", "cython>=3.0", "numpy>=1.23"]
build-backend = "setuptools.build_meta"

[project]
name = "fastlpr"
version = "1.0.0"
description = "Fast Local Polynomial Regression and Kernel Density Estimation using NUFFT"
authors = [{ name = "Ying Wang" }, { name = "Min Li" }]
maintainers = [{ name = "fastLPR Development Team" }]
requires-python = ">=3.9,<3.14"
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
dependencies = ["numpy>=1.23", "scipy>=1.10", "matplotlib>=3.7", "cython>=3.0", "numba>=0.57", "psutil>=5.9"]
keywords = [
    "nonparametric regression",
    "kernel density estimation",
    "local polynomial regression",
    "NUFFT",
    "fast Fourier transform",
    "smoothing",
    "bandwidth selection",
    "GCV",
    "cross-validation",
    "scattered data",
    "statistical computing",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.7",
    "ruff>=0.1.6",
    "mypy>=1.5",
]
docs = ["sphinx>=7.0", "furo>=2023.9.10"]
accel = [
    "cython>=3.0",
    "numba>=0.57",
]

[project.urls]
Homepage = "https://github.com/rigelfalcon/fastLPR"
Repository = "https://github.com/rigelfalcon/fastLPR"
Documentation = "https://github.com/rigelfalcon/fastLPR/tree/main/fastLPR_py"
"Bug Tracker" = "https://github.com/rigelfalcon/fastLPR/issues"

[tool.setuptools]
packages = ["fastlpr"]
package-dir = { "" = "src" }

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--disable-warnings -q"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "B"]
ignore = []
